<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mountains — Power Saving Warning</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Expanded:wght@400;700&display=swap" rel="stylesheet">
<script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/components.css">
<style>

/* ── Map sidebar controls ── */
.map-controls {
  position: absolute;
  right: 20px;
  top: 240px;
  z-index: 10;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.map-btn {
  width: 40px;
  height: 40px;
  background: var(--surface-blur);
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  border: none;
  cursor: pointer;
  flex-shrink: 0;
}
.map-btn.round { border-radius: var(--radius-lg); }
.map-btn .iconify {
  width: 20px;
  height: 20px;
  color: var(--color-text);
}

/* ── User marker (on map) ── */
.user-marker {
  position: absolute;
  left: 272px;
  top: 357px;
  z-index: 10;
  width: 30px;
  height: 30px;
}
.user-marker-outer {
  position: absolute;
  inset: 0;
  background: var(--color-primary);
  border-radius: var(--radius-lg);
}
.user-marker-inner {
  position: absolute;
  top: 5px; left: 5px;
  width: 20px; height: 20px;
  background: var(--color-surface);
  border-radius: var(--radius-lg);
  overflow: hidden;
}
.user-marker-inner img {
  width: 100%; height: 100%;
  object-fit: cover;
  mix-blend-mode: multiply;
}

/* ── Dark scrim (behind modal) ── */
.scrim {
  position: absolute;
  inset: 0;
  background: rgba(19,41,50,0.5);
  z-index: 20;
}

/* ── Modal card ── */
.modal {
  position: absolute;
  width: 329px;
  left: 50%;
  top: 50%;
  transform: translate(calc(-50% + 6.5px), calc(-50% + 6px));
  z-index: 30;
  background: var(--color-surface);  /* #D5F4FC */
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  border-radius: 20px;
  padding: 24px 36px 28px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}

/* ── Close button (top-right of card) ── */
.modal-close {
  position: absolute;
  top: -12px;
  right: -12px;
  width: 40px;
  height: 40px;
  background: var(--color-icon-bg);   /* #4E93AD */
  border-radius: var(--radius-sm);
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.modal-close::before,
.modal-close::after {
  content: '';
  position: absolute;
  width: 20px;
  height: 2.5px;
  background: var(--color-surface);   /* #D5F4FC */
  border-radius: 10px;
}
.modal-close::before { transform: rotate(45deg); }
.modal-close::after  { transform: rotate(-45deg); }

/* ── Modal text ── */
.modal-title {
  font-size: 20px;       /* heading-lg */
  font-weight: 700;
  color: var(--color-primary);   /* #E04700 */
  line-height: 1.25;
  text-align: center;
}
.modal-body {
  font-size: 16px;       /* body-md */
  font-weight: 400;
  color: var(--color-text);      /* #080808 */
  line-height: 1.25;
  text-align: center;
}

/* ── Peak annotations ── */
.peak {
  position: absolute;
  z-index: 10;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}
.peak-label {
  font-size: 12px;
  font-weight: 700;
  color: var(--color-text);
  line-height: 1.0;
  text-align: center;
  white-space: nowrap;
}
.peak-label span {
  font-weight: 400;
  display: block;
}
.peak-icon {
  width: 24px;
  height: 24px;
  color: var(--color-text);
}
.peak-icon .iconify { width: 24px; height: 24px; }

</style>
</head>
<body class="mountains-canvas">

<div class="device">
  <div class="screen">

    <!-- Background map photo -->
    <div class="bg" style="background-image: url('../assets/images/bg-map.jpg'); background-position: center center;"></div>

    <!-- Top dark gradient -->
    <div style="position:absolute;inset:0;height:200px;background:linear-gradient(to bottom,rgba(0,0,0,0.7),rgba(0,0,0,0));z-index:2;pointer-events:none;"></div>

    <!-- Status bar -->
    <div class="status-bar" style="z-index:10;">
      <span class="status-time" style="color:var(--color-text-on-dark);">9:41</span>
      <div class="status-icons">
        <svg width="17" height="12" viewBox="0 0 17 12" fill="none">
          <rect x="0"    y="7"   width="3" height="5"    rx="1" fill="#D5F4FC"/>
          <rect x="4.5"  y="4.5" width="3" height="7.5"  rx="1" fill="#D5F4FC"/>
          <rect x="9"    y="2"   width="3" height="10"   rx="1" fill="#D5F4FC"/>
          <rect x="13.5" y="0"   width="3" height="12"   rx="1" fill="#D5F4FC"/>
        </svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none">
          <circle cx="8" cy="11" r="1.2" fill="#D5F4FC"/>
          <path d="M5 8.2C6 7.2 7 6.8 8 6.8s2 .4 3 1.4" stroke="#D5F4FC" stroke-width="1.3" stroke-linecap="round"/>
          <path d="M2.5 5.4C4.2 3.7 6 2.8 8 2.8s3.8.9 5.5 2.6" stroke="#D5F4FC" stroke-width="1.3" stroke-linecap="round"/>
        </svg>
        <svg width="26" height="12" viewBox="0 0 26 12" fill="none">
          <rect x="0.5" y="0.5" width="22" height="11" rx="3.5" stroke="#D5F4FC" stroke-opacity="0.4"/>
          <rect x="2" y="2" width="17" height="8" rx="2" fill="#D5F4FC"/>
          <path d="M24 4.5v3a1.5 1.5 0 0 0 0-3z" fill="#D5F4FC" fill-opacity="0.45"/>
        </svg>
      </div>
    </div>

    <!-- Header -->
    <div class="header" style="z-index:10;">
      <img class="header-logo" src="../assets/logo/mountains-logo.svg" alt="Mountains">
      <div class="header-icons">
        <button class="header-icon-btn" title="Friends">
          <img class="icon" src="../assets/icons/profile.svg" alt="Friends">
        </button>
        <button class="header-icon-btn" title="Activity">
          <img class="icon" src="../assets/icons/chat.svg" alt="Activity">
        </button>
        <button class="header-icon-btn avatar" title="Profile">
          <img src="https://www.figma.com/api/mcp/asset/f9cba439-f4f1-4633-aba5-b1173eaf71dc" alt="Profile">
        </button>
      </div>
    </div>

    <!-- Location pill -->
    <button class="location-pill" style="z-index:10;">
      <span>Verbier</span>
      <img src="../assets/icons/dropdown-arrow.svg" alt="">
    </button>

    <!-- Map control sidebar — exact Figma assets -->
    <div class="map-controls" style="z-index:10;">
      <!-- Compass (round) -->
      <button class="map-btn round">
        <img src="../assets/icons/map-compass-needle.svg" style="width:auto;height:24px;" alt="">
      </button>
      <!-- Button 2 (layers/zoom) -->
      <img src="../assets/icons/map-btn-2.svg" style="width:40px;height:40px;display:block;" alt="">
      <!-- Button 1 -->
      <img src="../assets/icons/map-btn-1.svg" style="width:40px;height:40px;display:block;" alt="">
      <!-- 3D -->
      <button class="map-btn">
        <img src="../assets/icons/map-3d.svg" style="width:24px;height:auto;" alt="3D">
      </button>
      <!-- Button 3 -->
      <img src="../assets/icons/map-btn-3.svg" style="width:40px;height:40px;display:block;" alt="">
    </div>

    <!-- User marker -->
    <div class="user-marker">
      <div class="user-marker-outer"></div>
      <div class="user-marker-inner">
        <img src="https://www.figma.com/api/mcp/asset/f9cba439-f4f1-4633-aba5-b1173eaf71dc" alt="">
      </div>
    </div>

    <!-- Dark scrim behind modal -->
    <div class="scrim"></div>

    <!-- Power Saving Modal -->
    <div class="modal">
      <button class="modal-close" aria-label="Close"></button>
      <p class="modal-title">Power Saving Mode Detected</p>
      <p class="modal-body">For the best experience, please disable Power Saving Mode in your device settings.</p>
    </div>

    <!-- Bottom strip -->
    <div class="bottom-strip" style="z-index:10;">
      <div class="home-indicator"></div>
    </div>

  </div><!-- /screen -->
</div><!-- /device -->

<p class="page-label">Mountains · Power Saving Warning · Screen 4</p>

</body>
</html>
