<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mountains — Profile</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Expanded:wght@400;700&display=swap" rel="stylesheet">
<script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="/assets/css/components.css">
<style>

/* ── Map sidebar controls ── */
.map-controls {
  position: absolute;
  right: 20px;
  top: 354px;
  z-index: 10;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
/* map-3 is icon-only, needs a frosted glass wrapper */
.map-btn {
  width: 40px;
  height: 40px;
  background: var(--surface-blur);
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  border: none;
  cursor: pointer;
  flex-shrink: 0;
}

/* ── Profile card (bottom sheet) ── */
.profile-card {
  position: absolute;
  left: 0;
  right: 0;
  top: 420px;
  bottom: 0;
  background: var(--color-surface);
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  border-radius: 32px 32px 0 0;
  z-index: 10;
  display: flex;
  flex-direction: column;
}

/* ── Drag handle ── */
.drag-handle {
  width: 100px;
  height: 3px;
  background: var(--color-icon-bg);
  border-radius: 3px;
  opacity: 0.4;
  margin: 12px auto 0;
  flex-shrink: 0;
}

/* ── Title bar ── */
.profile-titlebar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 20px 16px;
  flex-shrink: 0;
}
.profile-title {
  font-size: 18px;
  font-weight: 700;
  color: var(--color-text);
  line-height: 1.25;
}
.icon-btn-sm {
  width: 30px;
  height: 30px;
  background: var(--color-icon-bg);
  border-radius: var(--radius-sm);
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.icon-btn-sm img {
  width: 18px;
  height: 18px;
  object-fit: contain;
}

/* ── Profile content ── */
.profile-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  scrollbar-width: none;
  padding: 0 20px 28px;
}
.profile-content::-webkit-scrollbar { display: none; }

/* ── Avatar + identity row ── */
.identity-row {
  display: flex;
  align-items: flex-start;
  gap: 16px;
  margin-bottom: 20px;
}
.profile-avatar {
  width: 100px;
  height: 100px;
  border-radius: var(--radius-sm);
  object-fit: cover;
  flex-shrink: 0;
  /* mix-blend-mode: multiply; — removed, washes out at this size */
}
.identity-info {
  padding-top: 8px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.profile-name {
  font-size: 18px;
  font-weight: 700;
  color: var(--color-text);
  line-height: 1.25;
}
.profile-badges {
  display: flex;
  gap: 6px;
  align-items: center;
}
.profile-badge {
  display: flex;
  align-items: center;
}
.profile-badge img {
  width: 20px;
  height: 20px;
  object-fit: cover;
  border-radius: 4px;
}

/* ── Bio ── */
.profile-bio {
  font-size: 15px;
  font-weight: 400;
  color: var(--color-text);
  line-height: 1.5;
  margin-bottom: 16px;
}

/* ── Stats strip ── */
.stats-strip {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
}
.stat-chip {
  flex: 1;
  background: var(--color-surface-muted);
  border-radius: var(--radius-sm);
  padding: 10px 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  cursor: pointer;
}
.stat-chip-value {
  font-size: 18px;
  font-weight: 700;
  color: var(--color-text);
  line-height: 1.2;
}
.stat-chip-label {
  font-size: 10px;
  font-weight: 700;
  color: var(--color-icon-bg);
  line-height: 1.25;
  text-align: center;
}

/* ── CTA button ── */
.btn-cta {
  width: 100%;
  height: 46px;
  background: var(--color-text);
  color: var(--color-text-on-dark);
  font-family: var(--font);
  font-size: 18px;
  font-weight: 700;
  border: none;
  border-radius: var(--radius-sm);
  cursor: pointer;
  flex-shrink: 0;
}

/* ── Notification badge on chat btn ── */
.header-icon-btn { position: relative; }
.notif-dot {
  position: absolute;
  top: 6px;
  right: 6px;
  width: 8px;
  height: 8px;
  background: var(--color-primary);
  border-radius: 50%;
}

</style>
</head>
<body class="mountains-canvas">

<div class="device">
  <div class="screen">

    <!-- Background photo -->
    <div class="bg" style="background-image: url('/assets/images/bg-profile.jpg'); background-position: center top;"></div>

    <!-- Top gradient -->
    <div style="position:absolute;inset:0;height:200px;background:linear-gradient(to bottom,rgba(0,0,0,0.7),rgba(0,0,0,0));z-index:2;pointer-events:none;"></div>

    <!-- Status bar -->
    <div class="status-bar" style="z-index:10;">
      <span class="status-time" style="color:var(--color-text-on-dark);">9:41</span>
      <div class="status-icons">
        <svg width="17" height="12" viewBox="0 0 17 12" fill="none">
          <rect x="0"    y="7"   width="3" height="5"    rx="1" fill="#D5F4FC"/>
          <rect x="4.5"  y="4.5" width="3" height="7.5"  rx="1" fill="#D5F4FC"/>
          <rect x="9"    y="2"   width="3" height="10"   rx="1" fill="#D5F4FC"/>
          <rect x="13.5" y="0"   width="3" height="12"   rx="1" fill="#D5F4FC"/>
        </svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none">
          <circle cx="8" cy="11" r="1.2" fill="#D5F4FC"/>
          <path d="M5 8.2C6 7.2 7 6.8 8 6.8s2 .4 3 1.4" stroke="#D5F4FC" stroke-width="1.3" stroke-linecap="round"/>
          <path d="M2.5 5.4C4.2 3.7 6 2.8 8 2.8s3.8.9 5.5 2.6" stroke="#D5F4FC" stroke-width="1.3" stroke-linecap="round"/>
        </svg>
        <svg width="26" height="12" viewBox="0 0 26 12" fill="none">
          <rect x="0.5" y="0.5" width="22" height="11" rx="3.5" stroke="#D5F4FC" stroke-opacity="0.4"/>
          <rect x="2" y="2" width="17" height="8" rx="2" fill="#D5F4FC"/>
          <path d="M24 4.5v3a1.5 1.5 0 0 0 0-3z" fill="#D5F4FC" fill-opacity="0.45"/>
        </svg>
      </div>
    </div>

    <!-- Header -->
    <div class="header" style="z-index:10;">
      <img class="header-logo" src="/assets/logo/mountains-logo.svg" alt="Mountains">
      <div class="header-icons">
        <button class="header-icon-btn" title="Friends">
          <img class="icon" src="/assets/icons/crowns-friends.svg" alt="Friends">
        </button>
        <button class="header-icon-btn" title="Activity">
          <img class="icon" src="/assets/icons/chat.svg" alt="Activity">
          <div class="notif-dot"></div>
        </button>
        <button class="header-icon-btn avatar" title="Profile">
          <img src="/assets/icons/profile-avatar.png" alt="Profile">
        </button>
      </div>
    </div>

    <!-- Location pill -->
    <button class="location-pill" style="z-index:10;">
      <span>Verbier</span>
      <img src="/assets/icons/dropdown-arrow.svg" alt="">
    </button>

    <!-- Map sidebar controls -->
    <div class="map-controls">
      <img src="/assets/icons/profile-map-2.svg" style="width:40px;height:40px;display:block;" alt="">
      <img src="/assets/icons/profile-map-1.svg" style="width:40px;height:40px;display:block;" alt="">
      <button class="map-btn">
        <img src="/assets/icons/profile-map-3.svg" style="width:20px;height:20px;" alt="">
      </button>
      <img src="/assets/icons/profile-map-4.svg" style="width:40px;height:40px;display:block;" alt="">
    </div>

    <!-- Profile card (bottom sheet) -->
    <div class="profile-card">

      <div class="drag-handle"></div>

      <!-- Title bar -->
      <div class="profile-titlebar">
        <button class="icon-btn-sm">
          <img src="/assets/icons/profile-back.svg" alt="Back">
        </button>
        <span class="profile-title">My Profile</span>
        <button class="icon-btn-sm">
          <img src="/assets/icons/profile-edit.svg" alt="Edit">
        </button>
      </div>

      <!-- Scrollable content -->
      <div class="profile-content">

        <!-- Avatar + identity -->
        <div class="identity-row">
          <img class="profile-avatar" src="/assets/icons/profile-avatar.png" alt="Lucas Moreau">
          <div class="identity-info">
            <p class="profile-name">Lucas Moreau</p>
            <div class="profile-badges">
              <span class="profile-badge"><img src="/assets/icons/profile-flag.svg" alt="Sweden"></span>
              <span class="profile-badge"><img src="/assets/icons/profile-ski.svg" alt="Skier"></span>
            </div>
          </div>
        </div>

        <!-- Bio -->
        <p class="profile-bio">Passionate about alpine skiing, snow and mountain life. Exploring new slopes every weekend.</p>

        <!-- Stats strip -->
        <div class="stats-strip">
          <div class="stat-chip">
            <span class="stat-chip-value">17</span>
            <span class="stat-chip-label">Days</span>
          </div>
          <div class="stat-chip">
            <span class="stat-chip-value">740</span>
            <span class="stat-chip-label">Season Pts</span>
          </div>
          <div class="stat-chip">
            <span class="stat-chip-value">76 km/h</span>
            <span class="stat-chip-label">Top Speed</span>
          </div>
        </div>

        <!-- CTA -->
        <button class="btn-cta">View Full Stats</button>

      </div><!-- /profile-content -->

    </div><!-- /profile-card -->

  </div><!-- /screen -->
</div><!-- /device -->

<p class="page-label">Mountains · Profile · Screen 7</p>

</body>
</html>
