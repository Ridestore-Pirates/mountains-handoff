<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mountains — [Screen Name]</title>

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Archivo+Expanded:wght@400;700&display=swap" rel="stylesheet">
<!-- Icons (Fluent UI filled — via Iconify, loads on demand) -->
<script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
<!-- Design tokens + components -->
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/components.css">

<style>
/*
 * Screen-specific styles go here.
 * Only add values not already covered by tokens.css / components.css.
 * All sizes/spacings must be multiples of 4 (4px grid rule).
 */

/* Scrollable content area — adjust top/bottom to fit your layout */
.content {
  position: absolute;
  top: 124px;      /* pill bottom 116px + 8px → first section-label padding handles the rest */
  left: 0; right: 0;
  bottom: 40px;    /* bottom-strip height */
  z-index: 10;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 0 20px 20px;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.content::-webkit-scrollbar { display: none; }

</style>
</head>
<body class="mountains-canvas">

<div class="device">
  <div class="screen">

    <!-- ── Background ─────────────────────────────── -->
    <div class="bg" style="background-image: url('../assets/images/bg-map.jpg');"></div>
    <div class="bg-overlay"></div>

    <!-- ── Status bar ─────────────────────────────── -->
    <div class="status-bar">
      <span class="status-time">9:41</span>
      <div class="status-icons">
        <!-- Signal -->
        <svg width="17" height="12" viewBox="0 0 17 12" fill="none">
          <rect x="0"    y="7"   width="3" height="5"  rx="1" fill="#D5F4FC"/>
          <rect x="4.5"  y="4.5" width="3" height="7.5" rx="1" fill="#D5F4FC"/>
          <rect x="9"    y="2"   width="3" height="10" rx="1" fill="#D5F4FC"/>
          <rect x="13.5" y="0"   width="3" height="12" rx="1" fill="#D5F4FC"/>
        </svg>
        <!-- WiFi -->
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none">
          <circle cx="8" cy="11" r="1.2" fill="#D5F4FC"/>
          <path d="M5 8.2C6 7.2 7 6.8 8 6.8s2 .4 3 1.4" stroke="#D5F4FC" stroke-width="1.3" stroke-linecap="round"/>
          <path d="M2.5 5.4C4.2 3.7 6 2.8 8 2.8s3.8.9 5.5 2.6" stroke="#D5F4FC" stroke-width="1.3" stroke-linecap="round"/>
        </svg>
        <!-- Battery -->
        <svg width="26" height="12" viewBox="0 0 26 12" fill="none">
          <rect x="0.5" y="0.5" width="22" height="11" rx="3.5" stroke="#D5F4FC" stroke-opacity="0.4"/>
          <rect x="2" y="2" width="17" height="8" rx="2" fill="#D5F4FC"/>
          <path d="M24 4.5v3a1.5 1.5 0 0 0 0-3z" fill="#D5F4FC" fill-opacity="0.45"/>
        </svg>
      </div>
    </div>

    <!-- ── Header ─────────────────────────────────── -->
    <div class="header">
      <img class="header-logo" src="../assets/logo/mountains-logo.svg" alt="Mountains">

      <div class="header-icons">
        <!-- Friends -->
        <button class="header-icon-btn" title="Friends">
          <img class="icon" src="../assets/icons/profile.svg" alt="Friends">
        </button>
        <!-- Chat / Activity (add .badge div inside when active) -->
        <button class="header-icon-btn" title="Activity">
          <img class="icon" src="../assets/icons/chat.svg" alt="Activity">
          <!-- <div class="badge"></div> -->
        </button>
        <!-- Profile avatar -->
        <button class="header-icon-btn avatar" title="Profile">
          <img src="" alt="Profile">
          <!-- Replace src with user avatar URL -->
        </button>
      </div>
    </div>

    <!-- ── Location pill ──────────────────────────── -->
    <button class="location-pill">
      <span>Verbier</span>
      <img src="../assets/icons/dropdown-arrow.svg" alt="">
    </button>

    <!-- ── Screen content ─────────────────────────── -->
    <!--
      Replace this placeholder with your screen's actual content.
      Use component classes from components.css where possible.
      Remember:
        - All sizes/spacings = multiples of 4
        - Text on dark bg → color: var(--color-text-on-dark) — never use opacity
        - Body text → color: var(--color-text) — never muted unless it's a subtitle
        - No tab bar — navigation is in the header
        - Icons: <span class="iconify" data-icon="fluent:{name}-24-filled"></span>
          Social/friend → teal bg (.notif-icon)
          Personal milestone → orange bg (.notif-icon.milestone)
    -->
    <div class="content">

      <!-- Your content goes here -->

    </div><!-- /content -->

    <!-- ── Bottom strip (iOS home indicator) ─────── -->
    <div class="bottom-strip">
      <div class="home-indicator"></div>
    </div>

  </div><!-- /screen -->
</div><!-- /device -->

<p class="page-label">Mountains · [Screen Name] · Screen [N]</p>

<!-- Iconify loads icons automatically — no init needed -->
</body>
</html>
