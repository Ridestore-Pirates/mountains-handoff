<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mountains — Top Speed</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Expanded:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/components.css">
<style>

/* ── Logo only (no full header) ── */
.screen-logo {
  position: absolute;
  left: 20px;
  top: 55px;
  width: 140px;
  height: 25px;
  z-index: 10;
  object-fit: contain;
  object-position: left center;
}

/* ── Main stat card ── */
.stat-card {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  top: 300px;
  width: 194px;
  height: 84px;
  background: var(--color-primary);
  border-radius: var(--radius-sm);
  z-index: 10;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0;
}

.stat-number-row {
  display: flex;
  align-items: baseline;
  gap: 4px;
}
.stat-number {
  font-size: 38px;
  font-weight: 700;
  color: var(--color-text-on-dark);
  line-height: 1.15;
}
.stat-unit {
  font-size: 18px;
  font-weight: 700;
  color: var(--color-text-on-dark);
  line-height: 1.25;
}
.stat-label {
  font-size: 15px;
  font-weight: 700;
  color: var(--color-text-on-dark);
  line-height: 1.25;
}

/* ── Pagination dots ── */
.pagination-dots {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  top: 402px;
  z-index: 10;
  display: flex;
  align-items: center;
  gap: 15px;
}
.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: rgba(213,244,252,0.55);
  flex-shrink: 0;
}
.dot.active {
  width: 10px;
  height: 10px;
  background: var(--color-primary);
}

/* ── View button ── */
.btn-view {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  top: 432px;
  width: 194px;
  height: 44px;
  background: var(--color-text);
  color: var(--color-text-on-dark);
  font-family: var(--font);
  font-size: 17px;
  font-weight: 700;
  border: none;
  border-radius: var(--radius-sm);
  cursor: pointer;
  z-index: 10;
}

/* ── Close button ── */
.btn-close {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  top: 766px;
  width: 194px;
  height: 44px;
  background: var(--color-surface);
  color: var(--color-text);
  font-family: var(--font);
  font-size: 17px;
  font-weight: 700;
  border: none;
  border-radius: var(--radius-sm);
  cursor: pointer;
  z-index: 10;
}

</style>
</head>
<body class="mountains-canvas">

<div class="device">
  <div class="screen">

    <!-- Background photo -->
    <div class="bg" style="background-image: url('../assets/images/bg-top-speed.png'); background-position: center center;"></div>

    <!-- Top gradient for status bar -->
    <div style="position:absolute;inset:0;height:200px;background:linear-gradient(to bottom,rgba(0,0,0,0.6),rgba(0,0,0,0));z-index:2;pointer-events:none;"></div>

    <!-- Status bar -->
    <div class="status-bar" style="z-index:10;">
      <span class="status-time" style="color:var(--color-text-on-dark);">9:41</span>
      <div class="status-icons">
        <svg width="17" height="12" viewBox="0 0 17 12" fill="none">
          <rect x="0"    y="7"   width="3" height="5"    rx="1" fill="#D5F4FC"/>
          <rect x="4.5"  y="4.5" width="3" height="7.5"  rx="1" fill="#D5F4FC"/>
          <rect x="9"    y="2"   width="3" height="10"   rx="1" fill="#D5F4FC"/>
          <rect x="13.5" y="0"   width="3" height="12"   rx="1" fill="#D5F4FC"/>
        </svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none">
          <circle cx="8" cy="11" r="1.2" fill="#D5F4FC"/>
          <path d="M5 8.2C6 7.2 7 6.8 8 6.8s2 .4 3 1.4" stroke="#D5F4FC" stroke-width="1.3" stroke-linecap="round"/>
          <path d="M2.5 5.4C4.2 3.7 6 2.8 8 2.8s3.8.9 5.5 2.6" stroke="#D5F4FC" stroke-width="1.3" stroke-linecap="round"/>
        </svg>
        <svg width="26" height="12" viewBox="0 0 26 12" fill="none">
          <rect x="0.5" y="0.5" width="22" height="11" rx="3.5" stroke="#D5F4FC" stroke-opacity="0.4"/>
          <rect x="2" y="2" width="17" height="8" rx="2" fill="#D5F4FC"/>
          <path d="M24 4.5v3a1.5 1.5 0 0 0 0-3z" fill="#D5F4FC" fill-opacity="0.45"/>
        </svg>
      </div>
    </div>

    <!-- Logo only -->
    <img class="screen-logo" src="../assets/logo/mountains-logo.svg" alt="Mountains">

    <!-- Stat card -->
    <div class="stat-card">
      <div class="stat-number-row">
        <span class="stat-number">74.0</span>
        <span class="stat-unit">km/h</span>
      </div>
      <span class="stat-label">Top Speed</span>
    </div>

    <!-- Pagination dots (7 stats, first active) -->
    <div class="pagination-dots">
      <div class="dot active"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>

    <!-- View button -->
    <button class="btn-view">View</button>

    <!-- Close button -->
    <button class="btn-close">Close</button>

  </div><!-- /screen -->
</div><!-- /device -->

<p class="page-label">Mountains · Top Speed · Screen 6</p>

</body>
</html>
